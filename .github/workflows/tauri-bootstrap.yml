# Temporary, limited to feature/tauri-desktop; removed after lockfiles/icons are committed.
name: Tauri dependency and icon bootstrap

on:
  push:
    branches: [feature/tauri-desktop]

permissions:
  contents: write

jobs:
  generate-locks:
    if: "!contains(github.event.head_commit.message, '[tauri-lock-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tauri-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and generate npm lockfile
        run: npm install --no-audit --no-fund
      - name: Prepare official favicon as square SVG for Tauri
        run: |
          mkdir -p src-tauri/icons
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path("public/favicon.svg").read_text(encoding="utf-8")
          src = src.replace('width="48" height="46"', 'width="1024" height="1024"')
          src = src.replace('viewBox="0 0 48 46"', 'viewBox="-2 -3 52 52"')
          src = re.sub(r';fill:color\(display-p3[^;]+\);fill-opacity:1', '', src)
          Path("src-tauri/icons/favicon-square.svg").write_text(src, encoding="utf-8")
          PY
      - name: Generate Tauri icons from existing project favicon
        run: npx tauri icon src-tauri/icons/favicon-square.svg
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit reproducible locks and generated icons on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src-tauri/icons/
          if ! git diff --cached --quiet; then
            git commit -m "chore(tauri): generate npm and cargo locks and favicon icons [tauri-lock-generated]"
            git push origin HEAD:feature/tauri-desktop
          fi
