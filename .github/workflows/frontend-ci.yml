name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # An unconfigured production build must fail before deployment.
      - name: Reject production build without API URL
        run: |
          if env -u VITE_API_BASE_URL npm run build; then
            echo "::error::Build unexpectedly succeeded without VITE_API_BASE_URL"
            exit 1
          fi
      - name: Build production with explicit test API URL
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - run: npm run lint
      - run: npm test
